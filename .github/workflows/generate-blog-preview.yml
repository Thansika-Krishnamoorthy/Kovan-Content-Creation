name: Render Markdown blog previews

on:
  push:
    branches-ignore:
      - main
    paths:
      - "content/**/*.md"
      - "templates/blog-*.html"
      - "scripts/blog_renderer/**"
      - "scripts/render_*blog.py"
      - "requirements-blog-renderer.txt"
  pull_request:
    paths:
      - "content/**/*.md"
      - "templates/blog-*.html"
      - "scripts/blog_renderer/**"
      - "scripts/render_*blog.py"
      - "requirements-blog-renderer.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render added Markdown with Kovan templates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-blog-renderer.txt

      - name: Install renderer dependencies
        run: python -m pip install --requirement requirements-blog-renderer.txt

      - name: Find Markdown files added in the target commit
        id: markdown
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target_sha="$(git log -1 --format=%H --diff-filter=A -- ':(glob)content/**/*.md')"
          else
            target_sha="${{ github.sha }}"
          fi

          if [[ -z "$target_sha" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff-tree --root --no-commit-id --name-only --diff-filter=A -r \
            "$target_sha" -- ':(glob)content/**/*.md' \
            | awk 'NF && $0 != "content/README.md"' > added-markdown.txt

          if [[ -s added-markdown.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Markdown files to render:"
            sed 's/^/- /' added-markdown.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No newly added content Markdown files were found."
          fi

      - name: Render HTML previews
        if: steps.markdown.outputs.found == 'true'
        shell: bash
        run: |
          mapfile -t markdown_files < added-markdown.txt
          python scripts/render_blog.py \
            --output-dir generated-blog-previews \
            --download-remote-images \
            --overwrite \
            "${markdown_files[@]}"

      - name: Validate renderer
        run: python -m unittest discover -s tests -p "test_blog_renderer.py"

      - name: Upload rendered website preview
        if: steps.markdown.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-blog-previews
          path: |
            generated-blog-previews/
            05 Brand Assets/logo_horizontal.png
            05 Brand Assets/logo_mono_white.png
            05 Brand Assets/graphic_dotwave.png
            05 Brand Assets/graphic_rings.png
            05 Brand Assets/graphic_spark.png
          if-no-files-found: error
          retention-days: 14
